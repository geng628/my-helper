<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Helper — 本地网页对话</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-2: #1f2430;
      --border: #2a3142;
      --text: #e6ebf5;
      --muted: #9aa4b8;
      --accent: #5b8cff;
      --accent-soft: rgba(91, 140, 255, 0.14);
      --user-bg: #253b6e;
      --ok: #3ecf8e;
      --warn: #f5b942;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .pill {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .setup-form { display: flex; flex-direction: column; gap: 12px; font-family: inherit; white-space: normal; }
    .setup-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text); }
    .setup-form select, .setup-form input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    .setup-form select:focus, .setup-form input:focus { border-color: var(--accent); }
    .setup-hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .setup-msg { font-size: 12.5px; min-height: 18px; }
    .setup-msg.ok { color: var(--ok); }
    .setup-msg.err { color: var(--err); }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    button:hover { border-color: var(--accent); background: #262d3d; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 8px 16px;
      font-size: 13px;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.7;
    }
    .msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 84%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 11px 14px;
      border-radius: 12px;
      line-height: 1.65;
      word-break: break-word;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    .msg.user .bubble,
    .msg.assistant.error .bubble {
      white-space: pre-wrap;
    }
    .msg.assistant .bubble {
      white-space: normal;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-color: #365499;
    }
    .msg.error .bubble {
      border-color: var(--err);
      color: #ffc2c2;
    }
    .bubble h2, .bubble h3, .bubble h4, .bubble h5 {
      margin: 10px 0 6px;
      font-weight: 600;
      line-height: 1.35;
    }
    .bubble h2:first-child, .bubble h3:first-child, .bubble h4:first-child, .bubble p:first-child { margin-top: 0; }
    .bubble p { margin: 6px 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
    .bubble li { margin: 3px 0; }
    .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
    .bubble th { background: var(--panel-2); }
    .bubble blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--accent); color: var(--muted); }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .bubble a { color: #8cb4ff; text-decoration: underline; }
    .bubble code {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
    }
    .bubble pre {
      background: #0b0d12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 8px 0 4px;
    }
    .bubble pre code {
      background: none;
      padding: 0;
    }
    details.thinking {
      width: 100%;
      background: rgba(91, 140, 255, 0.08);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    details.thinking summary {
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
    }
    .thinking-body {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
      color: #c2cbe0;
    }
    details.tools {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    details.tools summary {
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
    }
    .tool-item {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tool-item.pending {
      color: var(--warn);
    }
    .tool-name { color: #8cb4ff; font-weight: 600; }
    .submeta {
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge-mem { color: var(--ok); }

    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 12px 16px;
    }
    .composer {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(760px, 100%);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span id="statusDot" class="dot"></span>
      <span>My Helper 本地对话</span>
      <span id="sessionPill" class="pill">会话: web</span>
    </div>
    <div class="meta">
      <span id="toolCount" class="pill">工具: -</span>
      <span id="cachePill" class="pill">KV 缓存: 待统计</span>
    </div>
    <div class="actions">
      <button id="btnModelSetup">模型设置</button>
      <button id="btnMemory">查看记忆</button>
      <button id="btnRefresh">刷新索引</button>
      <button id="btnNewSession">新会话</button>
    </div>
  </header>

  <main id="chat">
    <div class="empty" id="emptyState">
      已连接本地 My Helper（零第三方依赖）。<br />
      试试问它：“现在几点了？”、“帮我看看最近 3 条 git 提交”、“记住我偏好简洁中文回答”。<br />
      按 <code>Enter</code> 发送，<code>Shift + Enter</code> 换行。
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="btnSend" class="primary">发送</button>
    </div>
  </footer>

  <div id="modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <span id="modalTitle">记忆与状态</span>
        <button id="btnCloseModal">关闭</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const emptyEl = document.getElementById("emptyState");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("btnSend");
    const statusDot = document.getElementById("statusDot");
    const sessionPill = document.getElementById("sessionPill");
    const toolCount = document.getElementById("toolCount");
    const cachePill = document.getElementById("cachePill");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    let chatId = localStorage.getItem("my_helper_chat_id") || "web";
    let busy = false;

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatBold(text) {
      return text.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderInlineMarkdown(escapedLine) {
      return escapedLine
        .split(/(`[^`\n]+`|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g)
        .map((seg) => {
          if (seg.length >= 2 && seg.startsWith("`") && seg.endsWith("`")) return `<code>${seg.slice(1, -1)}</code>`;
          const link = seg.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/);
          if (link) return `<a href="${link[2]}" target="_blank" rel="noopener noreferrer">${formatBold(link[1])}</a>`;
          return formatBold(seg);
        })
        .join("");
    }

    function splitPipeRow(line) {
      const trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return trimmed.split("|").map((cell) => renderInlineMarkdown(escapeHtml(cell.trim())));
    }

    function renderMarkdownBlock(blockText) {
      const lines = blockText.split("\n");
      const out = [];
      let i = 0;
      const para = [];
      const flushPara = () => {
        if (para.length === 0) return;
        out.push(`<p>${para.map((l) => renderInlineMarkdown(escapeHtml(l))).join("<br/>")}</p>`);
        para.length = 0;
      };
      const sepRe = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/;
      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();
        if (!trimmed) {
          flushPara();
          i += 1;
          continue;
        }
        const hMatch = trimmed.match(/^(#{1,4})\s+(.+)$/);
        if (hMatch) {
          flushPara();
          const lvl = Math.min(5, hMatch[1].length + 1);
          out.push(`<h${lvl}>${renderInlineMarkdown(escapeHtml(hMatch[2]))}</h${lvl}>`);
          i += 1;
          continue;
        }
        if (/^[-*_]{3,}$/.test(trimmed)) {
          flushPara();
          out.push("<hr/>");
          i += 1;
          continue;
        }
        if (/^>\s?/.test(trimmed)) {
          flushPara();
          const quotes = [];
          while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
            quotes.push(renderInlineMarkdown(escapeHtml(lines[i].trim().replace(/^>\s?/, ""))));
            i += 1;
          }
          out.push(`<blockquote>${quotes.join("<br/>")}</blockquote>`);
          continue;
        }
        if (trimmed.includes("|") && i + 1 < lines.length && sepRe.test(lines[i + 1])) {
          flushPara();
          const headers = splitPipeRow(trimmed);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().includes("|")) {
            rows.push(splitPipeRow(lines[i]));
            i += 1;
          }
          const thHtml = headers.map((h) => `<th>${h}</th>`).join("");
          const bodyHtml = rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("");
          out.push(`<table><thead><tr>${thHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>`);
          continue;
        }
        if (/^[-*+]\s+/.test(trimmed)) {
          flushPara();
          const items = [];
          while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) {
            items.push(`<li>${renderInlineMarkdown(escapeHtml(lines[i].trim().replace(/^[-*+]\s+/, "")))}</li>`);
            i += 1;
          }
          out.push(`<ul>${items.join("")}</ul>`);
          continue;
        }
        if (/^\d+\.\s+/.test(trimmed)) {
          flushPara();
          const items = [];
          while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
            items.push(`<li>${renderInlineMarkdown(escapeHtml(lines[i].trim().replace(/^\d+\.\s+/, "")))}</li>`);
            i += 1;
          }
          out.push(`<ol>${items.join("")}</ol>`);
          continue;
        }
        para.push(line);
        i += 1;
      }
      flushPara();
      return out.join("");
    }

    function renderMarkdownLite(text) {
      const norm = String(text || "").replace(/\r\n/g, "\n");
      const fenceRe = /```[^\n`]*\n([\s\S]*?)(?:```|$)/g;
      const chunks = [];
      let cursor = 0;
      let match;
      while ((match = fenceRe.exec(norm)) !== null) {
        if (match.index > cursor) chunks.push(renderMarkdownBlock(norm.slice(cursor, match.index)));
        chunks.push(`<pre><code>${escapeHtml(match[1].replace(/\n$/, ""))}</code></pre>`);
        cursor = fenceRe.lastIndex;
      }
      if (cursor < norm.length) chunks.push(renderMarkdownBlock(norm.slice(cursor)));
      return chunks.join("");
    }

    function formatCacheLine(cache) {
      if (!cache || !cache.llm_calls) return "";
      const parts = [];
      if (cache.prompt_tokens > 0 && cache.server_cache_hit_rate != null) {
        parts.push(`服务端缓存 ${cache.cached_tokens}/${cache.prompt_tokens} (${(cache.server_cache_hit_rate * 100).toFixed(1)}%)`);
      }
      if (cache.mean_prefix_reuse_rate != null) {
        parts.push(`前缀复用 ${(cache.mean_prefix_reuse_rate * 100).toFixed(1)}%`);
      }
      parts.push(`调用 ${cache.llm_calls} 次`);
      return parts.join(" · ");
    }

    function formatMs(ms) {
      if (typeof ms !== "number" || !Number.isFinite(ms)) return "";
      return ms < 1000 ? `${ms.toFixed(0)}ms` : `${(ms / 1000).toFixed(2)}s`;
    }

    function formatTelemetryLine(telemetry) {
      const t = telemetry && telemetry.telemetry && telemetry.telemetry.last_turn;
      if (!t || typeof t.total_ms !== "number") return "";
      const parts = [`总计 ${formatMs(t.total_ms)}`];
      if (typeof t.ttft_ms === "number") parts.push(`首字 ${formatMs(t.ttft_ms)}`);
      if (typeof t.llm_ms === "number") parts.push(`模型 ${formatMs(t.llm_ms)}`);
      if (t.tool_calls > 0 && typeof t.tool_ms === "number") parts.push(`工具 ${formatMs(t.tool_ms)}`);
      return parts.join(" · ");
    }

    function renderMetaRow(wrap, cache, consolidationScheduled, telemetry) {
      const metaBits = [];
      const perfText = formatTelemetryLine(telemetry);
      if (perfText) metaBits.push(`<span>⏱ ${escapeHtml(perfText)}</span>`);
      const cacheText = formatCacheLine(cache);
      if (cacheText) metaBits.push(`<span>⚡ ${escapeHtml(cacheText)}</span>`);
      if (consolidationScheduled) {
        metaBits.push(`<span class="badge-mem">🧠 已达阈值，后台正在自动沉淀记忆并压缩上下文</span>`);
      }
      if (metaBits.length > 0) {
        const sub = document.createElement("div");
        sub.className = "submeta";
        sub.innerHTML = metaBits.join("");
        wrap.appendChild(sub);
      }
    }

    function ensureToolsPanel(wrap, bubble, state, { openOnCreate = true } = {}) {
      if (!state.details) {
        const details = document.createElement("details");
        details.className = "tools";
        details.open = openOnCreate;
        const summary = document.createElement("summary");
        details.appendChild(summary);
        wrap.insertBefore(details, bubble);
        state.details = details;
        state.summary = summary;
      }
      if (!state.pending) state.pending = [];
    }

    function appendThinkingDelta(wrap, bubble, thinkingState, toolState, text) {
      const chunk = String(text || "");
      if (!chunk) return;
      if (!thinkingState.details) {
        const details = document.createElement("details");
        details.className = "thinking";
        details.open = true;
        const summary = document.createElement("summary");
        const body = document.createElement("div");
        body.className = "thinking-body";
        details.appendChild(summary);
        details.appendChild(body);
        wrap.insertBefore(details, (toolState && toolState.details) || bubble);
        thinkingState.details = details;
        thinkingState.summary = summary;
        thinkingState.body = body;
      }
      if (thinkingState.stepBreak) {
        if (thinkingState.text && !thinkingState.text.endsWith("\n")) {
          thinkingState.text += "\n\n";
        }
        thinkingState.stepBreak = false;
      }
      thinkingState.details.open = true;
      thinkingState.collapsed = false;
      thinkingState.summary.textContent = "💭 推导思路（思考中…）";
      thinkingState.text += chunk;
      thinkingState.body.innerHTML = escapeHtml(thinkingState.text);
    }

    function markStepBreak(ctx, { runningTool = false } = {}) {
      if (ctx.thinkingState) {
        ctx.thinkingState.stepBreak = true;
        if (runningTool && ctx.thinkingState.details && ctx.thinkingState.text && !ctx.thinkingState.collapsed) {
          ctx.thinkingState.summary.textContent = "💭 推导思路（执行工具中…）";
        }
      }
      if (ctx.replyText) {
        ctx.textStepBreak = true;
      }
    }

    function collapseThinking(thinkingState) {
      if (!thinkingState || !thinkingState.details) return;
      thinkingState.summary.textContent = `💭 推导思路（${thinkingState.text.length} 字，点击展开）`;
      if (!thinkingState.collapsed) {
        thinkingState.details.open = false;
        thinkingState.collapsed = true;
      }
    }

    function startToolStep(wrap, bubble, state, ev) {
      ensureToolsPanel(wrap, bubble, state, { openOnCreate: true });
      state.details.open = true;
      const toolName = String(ev.tool || "");
      const argsText = String(ev.arguments || "");
      const callId = String(ev.call_id || "");
      state.summary.textContent = `🔧 正在调用 ${toolName}…`;
      const item = document.createElement("div");
      item.className = "tool-item pending";
      item.setAttribute("data-call-id", callId);
      item.innerHTML = `<span class="tool-name">[调用中] ${escapeHtml(toolName)}</span>(${escapeHtml(argsText)}) …`;
      state.details.appendChild(item);
      state.pending.push({ callId, item });
    }

    function appendToolStep(wrap, bubble, state, step, { openOnCreate = true } = {}) {
      ensureToolsPanel(wrap, bubble, state, { openOnCreate });
      const stepCallId = String(step.call_id || "");
      let item = null;
      if (state.pending.length > 0) {
        let idx = -1;
        if (stepCallId) {
          idx = state.pending.findIndex((p) => p.callId === stepCallId);
          if (idx === -1) idx = state.pending.findIndex((p) => !p.callId);
        } else {
          idx = 0;
        }
        if (idx !== -1) {
          item = state.pending.splice(idx, 1)[0].item;
        }
      }
      const isNew = item === null;
      if (isNew) {
        item = document.createElement("div");
      }
      item.className = "tool-item";
      state.count += 1;
      state.summary.textContent = `🔧 工具调用轨迹（${state.count} 步）`;
      const obs = String(step.observation || "");
      const preview = obs.length > 600 ? obs.slice(0, 600) + "\n…（已折叠）" : obs;
      const durText = typeof step.duration_ms === "number" ? ` (${step.duration_ms.toFixed(1)}ms)` : "";
      item.innerHTML =
        `<span class="tool-name">[Act] ${escapeHtml(step.tool)}</span>(${escapeHtml(step.arguments)})${escapeHtml(durText)}\n` +
        `[Observe] ${escapeHtml(preview)}`;
      if (isNew) {
        state.details.appendChild(item);
      }
    }

    function applyStreamEvent(ctx, ev) {
      if (ev.type === "thinking_delta") {
        appendThinkingDelta(ctx.wrap, ctx.bubble, ctx.thinkingState, ctx.toolState, ev.text);
        chatEl.scrollTop = chatEl.scrollHeight;
      } else if (ev.type === "tool_start") {
        markStepBreak(ctx, { runningTool: true });
        startToolStep(ctx.wrap, ctx.bubble, ctx.toolState, ev);
        chatEl.scrollTop = chatEl.scrollHeight;
      } else if (ev.type === "tool_step") {
        markStepBreak(ctx);
        appendToolStep(ctx.wrap, ctx.bubble, ctx.toolState, ev);
        chatEl.scrollTop = chatEl.scrollHeight;
      } else if (ev.type === "text_delta") {
        if (ctx.thinkingState && !ctx.thinkingState.collapsed) {
          collapseThinking(ctx.thinkingState);
        }
        const piece = String(ev.text || "");
        if (piece) {
          if (ctx.textStepBreak) {
            if (ctx.replyText && !ctx.replyText.endsWith("\n")) {
              ctx.replyText += "\n\n";
            }
            ctx.textStepBreak = false;
          }
          ctx.replyText += piece;
          ctx.bubble.innerHTML = renderMarkdownLite(ctx.replyText);
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      } else if (ev.type === "done") {
        if (ctx.thinkingState && !ctx.thinkingState.details && ev.thinking) {
          appendThinkingDelta(ctx.wrap, ctx.bubble, ctx.thinkingState, ctx.toolState, ev.thinking);
        }
        collapseThinking(ctx.thinkingState);
        const finalReply = String(ev.reply || ctx.replyText);
        ctx.bubble.innerHTML = renderMarkdownLite(finalReply);
        if (ctx.toolState && ctx.toolState.details) ctx.toolState.details.open = false;
        renderMetaRow(ctx.wrap, ev.cache, ev.consolidation_scheduled, ev.telemetry);
        chatEl.scrollTop = chatEl.scrollHeight;
      } else if (ev.type === "error") {
        ctx.wrap.classList.add("error");
        ctx.bubble.textContent = String(ev.error || "流式对话失败");
      }
    }

    function appendMessage(role, content, extra = {}) {
      if (emptyEl) emptyEl.style.display = "none";
      const wrap = document.createElement("div");
      wrap.className = `msg ${role}${extra.error ? " error" : ""}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = role === "assistant" ? renderMarkdownLite(content) : escapeHtml(content);
      wrap.appendChild(bubble);

      if (extra.toolCalls && extra.toolCalls.length > 0) {
        const state = { details: null, summary: null, count: 0, pending: [] };
        for (const step of extra.toolCalls) {
          appendToolStep(wrap, bubble, state, step, { openOnCreate: false });
        }
      }

      renderMetaRow(wrap, extra.cache, extra.consolidationScheduled, extra.telemetry);

      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrap;
    }

    let activeAbortController = null;

    async function auth_fetch(url, options = {}) {
      const buildInit = (token) => {
        const headers = { ...(options.headers || {}) };
        if (token) headers["Authorization"] = `Bearer ${token}`;
        return { ...options, headers };
      };
      let token = sessionStorage.getItem("my_helper_web_token") || "";
      let res = await fetch(url, buildInit(token));
      if (res.status === 401) {
        const latest = sessionStorage.getItem("my_helper_web_token") || "";
        if (latest && latest !== token) {
          res = await fetch(url, buildInit(latest));
        } else {
          const entered = window.prompt("服务端已启用访问口令，请输入 Bearer Token：");
          if (entered && entered.trim()) {
            token = entered.trim();
            sessionStorage.setItem("my_helper_web_token", token);
            res = await fetch(url, buildInit(token));
            if (res.status === 401) {
              sessionStorage.removeItem("my_helper_web_token");
            }
          }
        }
      }
      return res;
    }

    async function refreshStatus() {
      sessionPill.textContent = `会话: ${chatId}`;
      try {
        const res = await auth_fetch("/api/status");
        if (!res.ok) return;
        const data = await res.json();
        statusDot.classList.toggle("ok", Boolean(data.llm_configured));
        statusDot.title = data.llm_configured ? "LLM 已就绪" : "LLM 未配置";
        toolCount.textContent = `工具: ${(data.tools || []).length} 个`;
        toolCount.title = (data.tools || []).join(", ");
        const c = data.cache || {};
        if (c.prompt_tokens > 0 && c.server_cache_hit_rate != null) {
          cachePill.textContent = `累计缓存: ${(c.server_cache_hit_rate * 100).toFixed(1)}% (${c.cached_tokens}/${c.prompt_tokens})`;
        } else if (c.mean_prefix_reuse_rate != null) {
          cachePill.textContent = `前缀复用: ${(c.mean_prefix_reuse_rate * 100).toFixed(1)}%`;
        }
        const bg = data.telemetry && data.telemetry.telemetry && data.telemetry.telemetry.background;
        if (bg && bg.runs > 0) {
          cachePill.title = `后台沉淀: ${bg.runs} 次（最近 ${formatMs(bg.last_duration_ms)}，输入 ${bg.prompt_tokens} tok）`;
        }
      } catch (_) {}
    }

    async function loadHistory() {
      chatEl.innerHTML = "";
      chatEl.appendChild(emptyEl);
      emptyEl.style.display = "block";
      try {
        const res = await auth_fetch(`/api/history?chat_id=${encodeURIComponent(chatId)}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.summary) {
          appendMessage("assistant", `【前情摘要】\n${data.summary}`);
        }
        for (const msg of data.messages || []) {
          appendMessage(msg.role === "user" ? "user" : "assistant", msg.content);
        }
      } catch (_) {}
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      inputEl.value = "";
      inputEl.style.height = "44px";

      appendMessage("user", text);
      const wrap = appendMessage("assistant", "思考与执行工具中…");
      const bubble = wrap.querySelector(".bubble");
      const streamCtx = {
        wrap,
        bubble,
        toolState: { details: null, summary: null, count: 0, pending: [] },
        thinkingState: { details: null, summary: null, body: null, text: "", collapsed: false, stepBreak: false },
        replyText: "",
        textStepBreak: false,
      };
      let streamClosedCleanly = false;
      const controller = new AbortController();
      activeAbortController = controller;

      function handleSseBlock(block) {
        for (const rawLine of block.split("\n")) {
          const line = rawLine.trim();
          if (!line.startsWith("data:")) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === "done" || ev.type === "error") streamClosedCleanly = true;
          applyStreamEvent(streamCtx, ev);
        }
      }

      try {
        const res = await auth_fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, chat_id: chatId }),
          signal: controller.signal,
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          wrap.classList.add("error");
          bubble.textContent = data.error || `请求失败（HTTP ${res.status}）`;
        } else if (res.body) {
          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          while (true) {
            const { value, done } = await reader.read();
            if (value) {
              buffer += decoder.decode(value, { stream: !done }).replace(/\r\n/g, "\n");
              let sep;
              while ((sep = buffer.indexOf("\n\n")) !== -1) {
                const block = buffer.slice(0, sep);
                buffer = buffer.slice(sep + 2);
                if (block.trim()) handleSseBlock(block);
              }
            }
            if (done) {
              buffer += decoder.decode().replace(/\r\n/g, "\n");
              if (buffer.trim()) handleSseBlock(buffer);
              break;
            }
          }
          if (!streamClosedCleanly && !streamCtx.replyText) {
            wrap.classList.add("error");
            bubble.textContent = "连接已提前中断，未收到完整回复。";
          }
        }
      } catch (err) {
        if (err && err.name === "AbortError") {
          if (!streamCtx.replyText) bubble.textContent = "已切换会话，本轮输出已取消。";
        } else {
          wrap.classList.add("error");
          bubble.textContent = `网络异常：${err}`;
        }
      } finally {
        if (activeAbortController === controller) activeAbortController = null;
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
        refreshStatus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "44px";
      inputEl.style.height = Math.min(160, inputEl.scrollHeight) + "px";
    });

    document.getElementById("btnModelSetup").addEventListener("click", async () => {
      modalTitle.textContent = "模型设置（选厂商 + 贴密钥，自动生成配置）";
      modalBody.textContent = "加载中…";
      modal.classList.add("open");
      try {
        const res = await auth_fetch("/api/models");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          modalBody.textContent = data.error || `读取模型预设失败（HTTP ${res.status}）`;
          return;
        }
        const presets = data.presets || [];
        const optionsHtml = presets
          .map((p) => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.label)}（默认：${escapeHtml(p.default_model)}）</option>`)
          .join("") + `<option value="custom">自定义 OpenAI 兼容接口</option>`;
        const consRole = data.configured && data.configured.roles && data.configured.roles.consolidator;
        const configuredText = data.configured
          ? `当前已生效默认模型：${escapeHtml(data.configured.default)}${
              consRole ? `（后台沉淀：${escapeHtml(consRole)}）` : ""
            }`
          : "尚未配置模型，填好下面两项即可直接使用。";

        modalBody.innerHTML = `
          <form id="modelSetupForm" class="setup-form">
            <div class="setup-hint">${configuredText}<br/>密钥将自动以 0600 权限保存在本机（已由 .gitignore 与沙箱隔离，不会上传或泄露）。</div>
            <label>
              选择模型厂商
              <select id="presetSelect">${optionsHtml}</select>
            </label>
            <label id="apiKeyRow">
              API Key（粘贴即可）
              <input id="apiKeyInput" type="password" autocomplete="off" placeholder="例如 sk-..." />
            </label>
            <details id="advancedOptions">
              <summary style="cursor:pointer;color:var(--muted);font-size:12px;">高级选项（一般不用填）</summary>
              <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
                <label>
                  自定义模型名（留空使用厂商默认）
                  <input id="modelNameInput" type="text" placeholder="留空即可" />
                </label>
                <label id="baseUrlRow" style="display:none;">
                  自定义接口地址 (base_url)
                  <input id="baseUrlInput" type="text" placeholder="https://api.example.com/v1" />
                </label>
              </div>
            </details>
            <div id="setupMsg" class="setup-msg"></div>
            <div><button type="submit" class="primary">保存并立即生效</button></div>
          </form>
        `;

        const presetSel = document.getElementById("presetSelect");
        const apiKeyRow = document.getElementById("apiKeyRow");
        const baseUrlRow = document.getElementById("baseUrlRow");
        const advancedOptions = document.getElementById("advancedOptions");
        const syncVisibility = () => {
          const picked = presets.find((p) => p.id === presetSel.value);
          apiKeyRow.style.display = picked && !picked.needs_key ? "none" : "flex";
          const isCustom = presetSel.value === "custom";
          baseUrlRow.style.display = isCustom ? "flex" : "none";
          if (isCustom) advancedOptions.open = true;
        };
        presetSel.addEventListener("change", syncVisibility);
        syncVisibility();

        document.getElementById("modelSetupForm").addEventListener("submit", async (ev) => {
          ev.preventDefault();
          const msgEl = document.getElementById("setupMsg");
          msgEl.className = "setup-msg";
          msgEl.textContent = "正在生成配置并切换…";
          try {
            const resp = await auth_fetch("/api/models/setup", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                preset: presetSel.value,
                api_key: document.getElementById("apiKeyInput").value.trim(),
                model: document.getElementById("modelNameInput").value.trim(),
                base_url: document.getElementById("baseUrlInput").value.trim(),
              }),
            });
            const out = await resp.json().catch(() => ({}));
            if (!resp.ok) {
              msgEl.className = "setup-msg err";
              msgEl.textContent = out.error || "保存失败";
              return;
            }
            msgEl.className = "setup-msg ok";
            msgEl.textContent = `已自动生成配置并热生效（默认模型：${out.configured.default}），现在可以直接对话！`;
            document.getElementById("apiKeyInput").value = "";
            refreshStatus();
          } catch (err) {
            msgEl.className = "setup-msg err";
            msgEl.textContent = `请求异常：${err}`;
          }
        });
      } catch (err) {
        modalBody.textContent = `读取模型预设失败：${err}`;
      }
    });

    document.getElementById("btnMemory").addEventListener("click", async () => {
      modalTitle.textContent = "长期记忆、规则与事实备忘";
      modalBody.textContent = "加载中…";
      modal.classList.add("open");
      try {
        const [memRes, stRes] = await Promise.all([auth_fetch("/api/memory"), auth_fetch("/api/status")]);
        const mem = await memRes.json().catch(() => ({}));
        const st = await stRes.json().catch(() => ({}));
        if (!memRes.ok || !stRes.ok) {
          modalBody.textContent = mem.error || st.error || `读取失败（HTTP ${memRes.ok ? stRes.status : memRes.status}）`;
          return;
        }
        modalBody.textContent =
          `${mem.overview}\n\n【已启用工具 (${(st.tools || []).length})】\n${(st.tools || []).join(", ")}\n\n` +
          `【后台沉淀状态】\n${JSON.stringify(st.consolidation || {}, null, 2)}`;
      } catch (err) {
        modalBody.textContent = `读取失败：${err}`;
      }
    });

    document.getElementById("btnRefresh").addEventListener("click", async () => {
      try {
        const res = await auth_fetch("/api/refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: chatId }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          appendMessage("assistant", data.error || `刷新失败（HTTP ${res.status}）`);
          return;
        }
        appendMessage("assistant", "已刷新当前会话的系统提示词缓存，下一轮将加载最新规则与 MEMORY.md 索引。");
      } catch (err) {
        appendMessage("assistant", `刷新请求异常：${err}`);
      }
    });

    document.getElementById("btnNewSession").addEventListener("click", () => {
      if (activeAbortController) {
        activeAbortController.abort();
        activeAbortController = null;
      }
      const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, "");
      const rand = Math.random().toString(36).slice(2, 6);
      chatId = `web-${stamp}-${rand}`;
      localStorage.setItem("my_helper_chat_id", chatId);
      refreshStatus();
      loadHistory();
    });

    document.getElementById("btnCloseModal").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    refreshStatus();
    loadHistory();
    inputEl.focus();
  </script>
</body>
</html>
