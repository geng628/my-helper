<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Helper — 本地网页对话</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-2: #1f2430;
      --border: #2a3142;
      --text: #e6ebf5;
      --muted: #9aa4b8;
      --accent: #5b8cff;
      --accent-soft: rgba(91, 140, 255, 0.14);
      --user-bg: #253b6e;
      --ok: #3ecf8e;
      --warn: #f5b942;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .pill {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .setup-form { display: flex; flex-direction: column; gap: 12px; font-family: inherit; white-space: normal; }
    .setup-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text); }
    .setup-form select, .setup-form input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    .setup-form select:focus, .setup-form input:focus { border-color: var(--accent); }
    .setup-hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .setup-msg { font-size: 12.5px; min-height: 18px; }
    .setup-msg.ok { color: var(--ok); }
    .setup-msg.err { color: var(--err); }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    button:hover { border-color: var(--accent); background: #262d3d; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 8px 16px;
      font-size: 13px;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.7;
    }
    .msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 84%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 11px 14px;
      border-radius: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-color: #365499;
    }
    .msg.error .bubble {
      border-color: var(--err);
      color: #ffc2c2;
    }
    .bubble code {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
    }
    .bubble pre {
      background: #0b0d12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 8px 0 4px;
    }
    .bubble pre code {
      background: none;
      padding: 0;
    }
    details.tools {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    details.tools summary {
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
    }
    .tool-item {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tool-name { color: #8cb4ff; font-weight: 600; }
    .submeta {
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge-mem { color: var(--ok); }

    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 12px 16px;
    }
    .composer {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(760px, 100%);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span id="statusDot" class="dot"></span>
      <span>My Helper 本地对话</span>
      <span id="sessionPill" class="pill">会话: web</span>
    </div>
    <div class="meta">
      <span id="toolCount" class="pill">工具: -</span>
      <span id="cachePill" class="pill">KV 缓存: 待统计</span>
    </div>
    <div class="actions">
      <button id="btnModelSetup">模型设置</button>
      <button id="btnMemory">查看记忆</button>
      <button id="btnRefresh">刷新索引</button>
      <button id="btnNewSession">新会话</button>
    </div>
  </header>

  <main id="chat">
    <div class="empty" id="emptyState">
      已连接本地 My Helper（零第三方依赖）。<br />
      试试问它：“现在几点了？”、“帮我看看最近 3 条 git 提交”、“记住我偏好简洁中文回答”。<br />
      按 <code>Enter</code> 发送，<code>Shift + Enter</code> 换行。
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="btnSend" class="primary">发送</button>
    </div>
  </footer>

  <div id="modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <span id="modalTitle">记忆与状态</span>
        <button id="btnCloseModal">关闭</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const emptyEl = document.getElementById("emptyState");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("btnSend");
    const statusDot = document.getElementById("statusDot");
    const sessionPill = document.getElementById("sessionPill");
    const toolCount = document.getElementById("toolCount");
    const cachePill = document.getElementById("cachePill");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    let chatId = localStorage.getItem("my_helper_chat_id") || "web";
    let busy = false;

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMarkdownLite(text) {
      const escaped = escapeHtml(text);
      const withBlocks = escaped.replace(/```[a-zA-Z0-9_-]*\n([\s\S]*?)```/g, (_, code) => {
        return `<pre><code>${code}</code></pre>`;
      });
      return withBlocks
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    }

    function formatCacheLine(cache) {
      if (!cache || !cache.llm_calls) return "";
      const parts = [];
      if (cache.prompt_tokens > 0 && cache.server_cache_hit_rate != null) {
        parts.push(`服务端缓存 ${cache.cached_tokens}/${cache.prompt_tokens} (${(cache.server_cache_hit_rate * 100).toFixed(1)}%)`);
      }
      if (cache.mean_prefix_reuse_rate != null) {
        parts.push(`前缀复用 ${(cache.mean_prefix_reuse_rate * 100).toFixed(1)}%`);
      }
      parts.push(`调用 ${cache.llm_calls} 次`);
      return parts.join(" · ");
    }

    function formatMs(ms) {
      if (typeof ms !== "number" || !Number.isFinite(ms)) return "";
      return ms < 1000 ? `${ms.toFixed(0)}ms` : `${(ms / 1000).toFixed(2)}s`;
    }

    function formatTelemetryLine(telemetry) {
      const t = telemetry && telemetry.telemetry && telemetry.telemetry.last_turn;
      if (!t || typeof t.total_ms !== "number") return "";
      const parts = [`总计 ${formatMs(t.total_ms)}`];
      if (typeof t.ttft_ms === "number") parts.push(`首字 ${formatMs(t.ttft_ms)}`);
      if (typeof t.llm_ms === "number") parts.push(`模型 ${formatMs(t.llm_ms)}`);
      if (t.tool_calls > 0 && typeof t.tool_ms === "number") parts.push(`工具 ${formatMs(t.tool_ms)}`);
      return parts.join(" · ");
    }

    function renderMetaRow(wrap, cache, consolidationScheduled, telemetry) {
      const metaBits = [];
      const perfText = formatTelemetryLine(telemetry);
      if (perfText) metaBits.push(`<span>⏱ ${escapeHtml(perfText)}</span>`);
      const cacheText = formatCacheLine(cache);
      if (cacheText) metaBits.push(`<span>⚡ ${escapeHtml(cacheText)}</span>`);
      if (consolidationScheduled) {
        metaBits.push(`<span class="badge-mem">🧠 已达阈值，后台正在自动沉淀记忆并压缩上下文</span>`);
      }
      if (metaBits.length > 0) {
        const sub = document.createElement("div");
        sub.className = "submeta";
        sub.innerHTML = metaBits.join("");
        wrap.appendChild(sub);
      }
    }

    function appendToolStep(wrap, bubble, state, step, { openOnCreate = true } = {}) {
      if (!state.details) {
        const details = document.createElement("details");
        details.className = "tools";
        details.open = openOnCreate;
        const summary = document.createElement("summary");
        details.appendChild(summary);
        wrap.insertBefore(details, bubble);
        state.details = details;
        state.summary = summary;
      }
      state.count += 1;
      state.summary.textContent = `🔧 工具调用轨迹（${state.count} 步）`;
      const item = document.createElement("div");
      item.className = "tool-item";
      const obs = String(step.observation || "");
      const preview = obs.length > 600 ? obs.slice(0, 600) + "\n…（已折叠）" : obs;
      const durText = typeof step.duration_ms === "number" ? ` (${step.duration_ms.toFixed(1)}ms)` : "";
      item.innerHTML =
        `<span class="tool-name">[Act] ${escapeHtml(step.tool)}</span>(${escapeHtml(step.arguments)})${escapeHtml(durText)}\n` +
        `[Observe] ${escapeHtml(preview)}`;
      state.details.appendChild(item);
    }

    function appendMessage(role, content, extra = {}) {
      if (emptyEl) emptyEl.style.display = "none";
      const wrap = document.createElement("div");
      wrap.className = `msg ${role}${extra.error ? " error" : ""}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = role === "assistant" ? renderMarkdownLite(content) : escapeHtml(content);
      wrap.appendChild(bubble);

      if (extra.toolCalls && extra.toolCalls.length > 0) {
        const state = { details: null, summary: null, count: 0 };
        for (const step of extra.toolCalls) {
          appendToolStep(wrap, bubble, state, step, { openOnCreate: false });
        }
      }

      renderMetaRow(wrap, extra.cache, extra.consolidationScheduled, extra.telemetry);

      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrap;
    }

    async function refreshStatus() {
      sessionPill.textContent = `会话: ${chatId}`;
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        statusDot.classList.toggle("ok", Boolean(data.llm_configured));
        statusDot.title = data.llm_configured ? "LLM 已就绪" : "LLM 未配置";
        toolCount.textContent = `工具: ${(data.tools || []).length} 个`;
        toolCount.title = (data.tools || []).join(", ");
        const c = data.cache || {};
        if (c.prompt_tokens > 0 && c.server_cache_hit_rate != null) {
          cachePill.textContent = `累计缓存: ${(c.server_cache_hit_rate * 100).toFixed(1)}% (${c.cached_tokens}/${c.prompt_tokens})`;
        } else if (c.mean_prefix_reuse_rate != null) {
          cachePill.textContent = `前缀复用: ${(c.mean_prefix_reuse_rate * 100).toFixed(1)}%`;
        }
        const bg = data.telemetry && data.telemetry.telemetry && data.telemetry.telemetry.background;
        if (bg && bg.runs > 0) {
          cachePill.title = `后台沉淀: ${bg.runs} 次（最近 ${formatMs(bg.last_duration_ms)}，输入 ${bg.prompt_tokens} tok）`;
        }
      } catch (_) {}
    }

    async function loadHistory() {
      chatEl.innerHTML = "";
      chatEl.appendChild(emptyEl);
      emptyEl.style.display = "block";
      try {
        const res = await fetch(`/api/history?chat_id=${encodeURIComponent(chatId)}`);
        const data = await res.json();
        if (data.summary) {
          appendMessage("assistant", `【前情摘要】\n${data.summary}`);
        }
        for (const msg of data.messages || []) {
          appendMessage(msg.role === "user" ? "user" : "assistant", msg.content);
        }
      } catch (_) {}
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      inputEl.value = "";
      inputEl.style.height = "44px";

      appendMessage("user", text);
      const wrap = appendMessage("assistant", "思考与执行工具中…");
      const bubble = wrap.querySelector(".bubble");
      const toolState = { details: null, summary: null, count: 0 };
      let replyText = "";

      function handleSseBlock(block) {
        for (const rawLine of block.split("\n")) {
          const line = rawLine.trim();
          if (!line.startsWith("data:")) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === "tool_step") {
            appendToolStep(wrap, bubble, toolState, ev);
            chatEl.scrollTop = chatEl.scrollHeight;
          } else if (ev.type === "text_delta") {
            replyText += String(ev.text || "");
            bubble.innerHTML = renderMarkdownLite(replyText);
            chatEl.scrollTop = chatEl.scrollHeight;
          } else if (ev.type === "done") {
            const finalReply = String(ev.reply || replyText);
            bubble.innerHTML = renderMarkdownLite(finalReply);
            if (toolState.details) toolState.details.open = false;
            renderMetaRow(wrap, ev.cache, ev.consolidation_scheduled, ev.telemetry);
            chatEl.scrollTop = chatEl.scrollHeight;
          } else if (ev.type === "error") {
            wrap.classList.add("error");
            bubble.textContent = String(ev.error || "流式对话失败");
          }
        }
      }

      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, chat_id: chatId }),
        });
        if (!res.ok) {
          const data = await res.json();
          wrap.classList.add("error");
          bubble.textContent = data.error || `请求失败（HTTP ${res.status}）`;
        } else if (res.body) {
          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          while (true) {
            const { value, done } = await reader.read();
            if (value) {
              buffer += decoder.decode(value, { stream: !done }).replace(/\r\n/g, "\n");
              let sep;
              while ((sep = buffer.indexOf("\n\n")) !== -1) {
                const block = buffer.slice(0, sep);
                buffer = buffer.slice(sep + 2);
                if (block.trim()) handleSseBlock(block);
              }
            }
            if (done) {
              buffer += decoder.decode().replace(/\r\n/g, "\n");
              if (buffer.trim()) handleSseBlock(buffer);
              break;
            }
          }
        }
      } catch (err) {
        wrap.classList.add("error");
        bubble.textContent = `网络异常：${err}`;
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
        refreshStatus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "44px";
      inputEl.style.height = Math.min(160, inputEl.scrollHeight) + "px";
    });

    document.getElementById("btnModelSetup").addEventListener("click", async () => {
      modalTitle.textContent = "模型设置（选厂商 + 贴密钥，自动生成配置）";
      modalBody.textContent = "加载中…";
      modal.classList.add("open");
      try {
        const res = await fetch("/api/models");
        const data = await res.json();
        const presets = data.presets || [];
        const optionsHtml = presets
          .map((p) => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.label)}（默认：${escapeHtml(p.default_model)}）</option>`)
          .join("") + `<option value="custom">自定义 OpenAI 兼容接口</option>`;
        const configuredText = data.configured
          ? `当前已生效默认模型：${escapeHtml(data.configured.default)}`
          : "尚未配置模型，填好下面两项即可直接使用。";

        modalBody.innerHTML = `
          <form id="modelSetupForm" class="setup-form">
            <div class="setup-hint">${configuredText}<br/>密钥将自动以 0600 权限保存在本机（已由 .gitignore 与沙箱隔离，不会上传或泄露）。</div>
            <label>
              选择模型厂商
              <select id="presetSelect">${optionsHtml}</select>
            </label>
            <label id="apiKeyRow">
              API Key（粘贴即可）
              <input id="apiKeyInput" type="password" autocomplete="off" placeholder="例如 sk-..." />
            </label>
            <details>
              <summary style="cursor:pointer;color:var(--muted);font-size:12px;">高级选项（一般不用填）</summary>
              <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
                <label>
                  自定义模型名（留空使用厂商默认）
                  <input id="modelNameInput" type="text" placeholder="留空即可" />
                </label>
                <label id="baseUrlRow" style="display:none;">
                  自定义接口地址 (base_url)
                  <input id="baseUrlInput" type="text" placeholder="https://api.example.com/v1" />
                </label>
              </div>
            </details>
            <div id="setupMsg" class="setup-msg"></div>
            <div><button type="submit" class="primary">保存并立即生效</button></div>
          </form>
        `;

        const presetSel = document.getElementById("presetSelect");
        const apiKeyRow = document.getElementById("apiKeyRow");
        const baseUrlRow = document.getElementById("baseUrlRow");
        const syncVisibility = () => {
          const picked = presets.find((p) => p.id === presetSel.value);
          apiKeyRow.style.display = picked && !picked.needs_key ? "none" : "flex";
          baseUrlRow.style.display = presetSel.value === "custom" ? "flex" : "none";
        };
        presetSel.addEventListener("change", syncVisibility);
        syncVisibility();

        document.getElementById("modelSetupForm").addEventListener("submit", async (ev) => {
          ev.preventDefault();
          const msgEl = document.getElementById("setupMsg");
          msgEl.className = "setup-msg";
          msgEl.textContent = "正在生成配置并切换…";
          try {
            const resp = await fetch("/api/models/setup", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                preset: presetSel.value,
                api_key: document.getElementById("apiKeyInput").value.trim(),
                model: document.getElementById("modelNameInput").value.trim(),
                base_url: document.getElementById("baseUrlInput").value.trim(),
              }),
            });
            const out = await resp.json();
            if (!resp.ok) {
              msgEl.className = "setup-msg err";
              msgEl.textContent = out.error || "保存失败";
              return;
            }
            msgEl.className = "setup-msg ok";
            msgEl.textContent = `已自动生成配置并热生效（默认模型：${out.configured.default}），现在可以直接对话！`;
            document.getElementById("apiKeyInput").value = "";
            refreshStatus();
          } catch (err) {
            msgEl.className = "setup-msg err";
            msgEl.textContent = `请求异常：${err}`;
          }
        });
      } catch (err) {
        modalBody.textContent = `读取模型预设失败：${err}`;
      }
    });

    document.getElementById("btnMemory").addEventListener("click", async () => {
      modalTitle.textContent = "长期记忆、规则与事实备忘";
      modalBody.textContent = "加载中…";
      modal.classList.add("open");
      try {
        const [memRes, stRes] = await Promise.all([fetch("/api/memory"), fetch("/api/status")]);
        const mem = await memRes.json();
        const st = await stRes.json();
        modalBody.textContent =
          `${mem.overview}\n\n【已启用工具 (${(st.tools || []).length})】\n${(st.tools || []).join(", ")}\n\n` +
          `【后台沉淀状态】\n${JSON.stringify(st.consolidation || {}, null, 2)}`;
      } catch (err) {
        modalBody.textContent = `读取失败：${err}`;
      }
    });

    document.getElementById("btnRefresh").addEventListener("click", async () => {
      await fetch("/api/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chatId }),
      });
      appendMessage("assistant", "已刷新当前会话的系统提示词缓存，下一轮将加载最新规则与 MEMORY.md 索引。");
    });

    document.getElementById("btnNewSession").addEventListener("click", () => {
      const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, "");
      chatId = `web-${stamp}`;
      localStorage.setItem("my_helper_chat_id", chatId);
      refreshStatus();
      loadHistory();
    });

    document.getElementById("btnCloseModal").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    refreshStatus();
    loadHistory();
    inputEl.focus();
  </script>
</body>
</html>
